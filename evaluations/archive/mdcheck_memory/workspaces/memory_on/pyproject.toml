[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdcheck-local"
version = "0.1.0"
description = "Standard-library Markdown local link checker"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "mdcheck contributors"}]
keywords = ["markdown", "links", "cli"]

[project.scripts]
mdcheck = "mdcheck:main"

[tool.setuptools]
py-modules = ["mdcheck"]
