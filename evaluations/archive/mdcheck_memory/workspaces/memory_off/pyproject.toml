[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mdcheck"
version = "0.1.0"
description = "A standard-library CLI for checking local Markdown links"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "mdcheck contributors" }]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Documentation",
]
dependencies = []

[project.scripts]
mdcheck = "mdcheck:main"

[tool.setuptools]
py-modules = ["mdcheck"]
