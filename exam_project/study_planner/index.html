<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="简单清晰的期末复习安排器">
  <title>期末复习安排器</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <div>
        <p class="eyebrow">FINAL REVIEW PLANNER</p>
        <h1>期末复习安排器</h1>
        <p class="subtitle">把剩余时间拆成今天就能开始的复习任务。</p>
      </div>
      <div class="header-mark" aria-hidden="true">◆</div>
    </div>
  </header>

  <main class="shell">
    <section class="settings-panel panel" aria-labelledby="settings-title">
      <div class="section-heading">
        <div>
          <p class="section-kicker">01 / 时间边界</p>
          <h2 id="settings-title">先设定你的节奏</h2>
        </div>
        <span class="saved-note" id="saved-note">自动保存</span>
      </div>
      <div class="form-grid settings-grid">
        <div class="field">
          <label for="start-date">开始日期</label>
          <input id="start-date" type="date">
          <p class="hint">计划从这一天开始。</p>
        </div>
        <div class="field">
          <label for="daily-limit">每日上限（小时）</label>
          <input id="daily-limit" type="number" min="0.01" step="0.1" inputmode="decimal" placeholder="例如 3">
          <p class="hint">所有课程每天合计不超过此数。</p>
        </div>
      </div>
    </section>

    <section class="panel" aria-labelledby="course-title">
      <div class="section-heading">
        <div>
          <p class="section-kicker">02 / 复习内容</p>
          <h2 id="course-title">添加课程</h2>
        </div>
        <span class="course-count" id="course-count">0 门课程</span>
      </div>
      <form id="course-form" novalidate>
        <div class="form-grid course-grid">
          <div class="field field-course-name">
            <label for="course-name">课程名称</label>
            <input id="course-name" type="text" maxlength="80" autocomplete="off" placeholder="例如：高等数学">
          </div>
          <div class="field">
            <label for="exam-date">考试日期</label>
            <input id="exam-date" type="date">
          </div>
          <div class="field">
            <label for="remaining-hours">剩余小时</label>
            <input id="remaining-hours" type="number" min="0.01" step="0.1" inputmode="decimal" placeholder="例如 8.5">
          </div>
        </div>
        <div class="form-actions">
          <button class="button button-primary" id="course-submit" type="submit"><span aria-hidden="true">＋</span> 添加课程</button>
          <button class="button button-quiet hidden" id="cancel-edit" type="button">取消编辑</button>
        </div>
      </form>
      <div class="table-wrap" id="course-table-wrap">
        <table class="data-table course-table">
          <caption>课程列表</caption>
          <thead><tr><th scope="col">课程</th><th scope="col">考试日期</th><th scope="col">剩余小时</th><th scope="col" class="actions-heading">操作</th></tr></thead>
          <tbody id="course-list"></tbody>
        </table>
        <p class="empty-state" id="course-empty">还没有课程，先添加一门吧。</p>
      </div>
    </section>

    <section class="status-area" id="status-area" role="status" aria-live="polite" aria-atomic="true"></section>

    <section class="plan-section" aria-labelledby="plan-title">
      <div class="section-heading plan-heading">
        <div>
          <p class="section-kicker">03 / 今日之后</p>
          <h2 id="plan-title">复习计划</h2>
          <p class="plan-meta" id="plan-meta">设置课程和时间后生成你的计划。</p>
        </div>
        <button class="button button-primary generate-button" id="generate-plan" type="button"><span aria-hidden="true">↗</span> 生成计划</button>
      </div>
      <div class="summary-strip hidden" id="summary-strip" aria-label="计划概览">
        <div><strong id="planned-hours">0</strong><span>已安排小时</span></div>
        <div><strong id="planned-days">0</strong><span>复习天数</span></div>
        <div><strong id="gap-hours">0</strong><span>不足小时</span></div>
      </div>
      <div class="table-wrap plan-table-wrap">
        <table class="data-table plan-table">
          <caption>复习计划</caption>
          <thead><tr><th scope="col">日期</th><th scope="col">课程</th><th scope="col">小时</th></tr></thead>
          <tbody id="plan-list"></tbody>
        </table>
        <p class="empty-state" id="plan-empty">生成计划后，这里会显示每天的复习安排。</p>
      </div>
    </section>
  </main>

  <footer class="site-footer"><div class="shell">数据只保存在此浏览器中 · 适合个人使用</div></footer>
</body>
</html>
