name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libseccomp2 nodejs golang-go
      - run: python -m pip install -e '.[dev,mcp]' setuptools wheel
      - name: Match sandbox toolchain paths
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from aster.safety.runner import SandboxRunner
          with open(os.environ["GITHUB_ENV"], "a") as environment:
              environment.write(f"PATH={SandboxRunner.environment(Path.cwd())['PATH']}\n")
          PY
      - run: python -m ruff check src tests scripts learn_web/scripts learn_web/tests
      - name: Core regression
        run: python -m pytest -q -m core
      - name: Remaining regression (including website)
        run: python -m pytest -q -m "not core"
      - run: aster --help && aster-tui --help
