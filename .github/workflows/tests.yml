name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libseccomp2 nodejs golang-go
      - run: python -m pip install -e '.[dev,docs,mcp]'
      - name: Verify sandbox toolchains
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          from aster.safety.runner import SandboxRunner
          env = SandboxRunner.environment(Path.cwd())
          for command in (["node", "--version"], ["go", "version"]):
              subprocess.run(command, env=env, check=True)
          PY
      - run: python -m ruff check src tests scripts evaluations learn_web/build.py learn_web/tests
      - name: Core regression
        run: python -m pytest -q -m core
      - name: Remaining regression (including website)
        run: python -m pytest -q -m "not core"
      - run: aster --help && aster-tui --help && aster-mcp-files --help
      - name: Offline runtime example
        run: python docs/learning/run_examples.py 00
