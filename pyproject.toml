[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "aster-harness"
version = "0.1.0"
description = "An evidence-driven local coding agent with one execution path for interactive use and RL."
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.10,<3", "textual>=1,<7", "tiktoken>=0.9,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.12,<1"]

[project.scripts]
aster = "aster.cli:main"
aster-tui = "aster.cli:tui_main"

[tool.hatch.build.targets.wheel]
packages = ["src/aster"]

[tool.pytest.ini_options]
testpaths = ["tests", "learn_web/tests"]
pythonpath = ["scripts", "learn_web/scripts"]
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = [
    "smoke: representative startup and end-to-end checks for the local edit loop (subset of core)",
    "core: main runtime, protocol, safety, persistence, terminal and training contracts",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
